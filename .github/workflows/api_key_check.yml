name: API Key Check (temporary)

# APIキー更新後の動作確認用の一時的なワークフロー。確認が済んだら削除する。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install SDK
        run: pip install anthropic==0.120.2

      - name: Call API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import anthropic

          client = anthropic.Anthropic()
          response = client.messages.create(
              model="claude-haiku-4-5",
              max_tokens=8,
              messages=[{"role": "user", "content": "OK とだけ答えてください"}],
          )
          print("✅ APIキーは有効です。応答:", response.content[0].text)
          EOF
